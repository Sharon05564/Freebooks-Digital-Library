<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Discover your next great read. Explore free ebooks, revisit the classics, and build a bookshelf of your own."
    />
    <title>Your account — FreeBooks</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/common.js" defer></script>
    <script src="/js/app.js" defer></script>
  </head>
  <body data-page="profile">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>
    <main id="main" class="narrow-main">
      <div class="page-heading">
        <div class="eyebrow">MAKE YOURSELF AT HOME</div>
        <h1>Your account.</h1>
        <p>A few details for your little corner of the library.</p>
      </div>
      <div id="profile-container">
        <form class="stack-form panel" id="profile-form">
          <label for="username"
            >Your name<input
              id="username"
              name="username"
              autocomplete="username"
              minlength="3"
              maxlength="50"
              required /></label
          ><label for="email"
            >Email address<input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
          /></label>
          <p id="form-message" class="form-message" role="status"></p>
          <button class="button button-dark" type="submit">
            Save changes <span data-icon="arrow"></span>
          </button>
        </form>
      </div>
    </main>
    <div id="site-footer"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
