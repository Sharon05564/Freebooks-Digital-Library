<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Discover your next great read. Explore free ebooks, revisit the classics, and build a bookshelf of your own."
    />
    <title>Explore the library — FreeBooks</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/common.js" defer></script>
    <script src="/js/app.js" defer></script>
  </head>
  <body data-page="search">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>
    <main id="main" class="page-main">
      <div class="page-heading">
        <div class="eyebrow">FOLLOW YOUR CURIOSITY</div>
        <h1 id="search-title">Explore the library.</h1>
        <p id="search-description">
          Every search is the start of a new chapter.
        </p>
      </div>
      <div class="results-search">
        <form class="search-form" action="/search.html" role="search">
          <label class="sr-only" for="searchBar"
            >Search by title or author</label
          ><span class="search-icon" data-icon="search"></span
          ><input
            id="searchBar"
            name="q"
            type="search"
            placeholder="Search by title or author"
            required
            autocomplete="off"
          /><button type="submit" class="button button-dark">
            Find a book <span data-icon="arrow"></span>
          </button>
        </form>
      </div>
      <div class="results-toolbar">
        <span id="result-summary" aria-live="polite"
          >Finding your next read…</span
        ><label class="select-label"
          >Category
          <select id="categorySelect">
            <option value="">All books</option>
            <option value="fiction">Fiction</option>
            <option value="fantasy">Fantasy</option>
            <option value="science">Science</option>
            <option value="history">History</option>
            <option value="poetry">Poetry</option>
          </select></label
        >
      </div>
      <div id="results" class="book-grid" aria-live="polite"></div>
      <nav class="pagination" aria-label="Search pages">
        <button id="prevBtn" class="button button-outline">← Previous</button
        ><span id="page-number">Page 1</span
        ><button id="nextBtn" class="button button-outline">Next →</button>
      </nav>
    </main>
    <div id="site-footer"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
