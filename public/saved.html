<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Discover your next great read. Explore free ebooks, revisit the classics, and build a bookshelf of your own."
    />
    <title>Your bookshelf — FreeBooks</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/common.js" defer></script>
    <script src="/js/app.js" defer></script>
  </head>
  <body data-page="saved">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>
    <main id="main" class="page-main">
      <div class="page-heading">
        <div class="eyebrow">A LITTLE COLLECTION OF YOU</div>
        <h1>Your bookshelf.</h1>
        <p>The stories you want to come back to. All in one place.</p>
      </div>
      <div class="results-toolbar">
        <span id="saved-count">Your saved books</span
        ><a class="text-link" href="/search.html?q=classic+literature"
          >Find something new <span data-icon="arrow"></span
        ></a>
      </div>
      <div id="savedBooks" class="book-grid" aria-live="polite"></div>
    </main>
    <div id="site-footer"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
