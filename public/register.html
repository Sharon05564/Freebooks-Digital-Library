<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Discover your next great read. Explore free ebooks, revisit the classics, and build a bookshelf of your own."
    />
    <title>Create your bookshelf — FreeBooks</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/common.js" defer></script>
    <script src="/js/app.js" defer></script>
  </head>
  <body data-page="register">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>
    <main id="main" class="auth-main">
      <div class="auth-art" aria-hidden="true">
        <div class="auth-cover cover-one">
          <img src="/assets/covers/pride.svg" alt="" />
        </div>
        <div class="auth-cover cover-two">
          <img src="/assets/covers/alice.svg" alt="" />
        </div>
        <div class="auth-art-caption">
          <span class="eyebrow">YOUR NEXT CHAPTER STARTS HERE</span>
          <h2>A shelf of stories.<br />A world of possibility.</h2>
        </div>
      </div>
      <div class="auth-panel">
        <div class="eyebrow">MAKE YOURSELF AT HOME</div>
        <h1>A bookshelf<br />of your own.</h1>
        <p>Save your discoveries. Find your next favorite.</p>
        <a
          id="google-auth"
          class="button button-google"
          href="/auth/google/signup"
          ><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#4285F4"
              d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 01-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36z"
            />
            <path
              fill="#34A853"
              d="M12 22c2.7 0 4.96-.9 6.62-2.42l-3.24-2.51c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.12H3.05v2.59A10 10 0 0012 22z"
            />
            <path
              fill="#FBBC05"
              d="M6.4 13.91a6 6 0 010-3.82V7.5H3.05a10 10 0 000 9l3.35-2.59z"
            />
            <path
              fill="#EA4335"
              d="M12 5.97c1.47 0 2.79.51 3.82 1.51l2.87-2.87A9.6 9.6 0 0012 2a10 10 0 00-8.95 5.5l3.35 2.59A6 6 0 0112 5.97z"
            /></svg
          ><span>Sign up with Google</span></a
        >
        <p
          id="google-message"
          class="form-message google-message"
          role="status"
          aria-live="polite"
        ></p>
        <div class="auth-divider"><span>or continue with email</span></div>
        <form
          id="auth-form"
          method="post"
          action="/auth/register"
          data-mode="register"
          class="stack-form"
        >
          <label for="username"
            >Your name<input
              id="username"
              name="username"
              autocomplete="username"
              minlength="3"
              maxlength="50"
              placeholder="What should we call you?"
              required /></label
          ><label for="email"
            >Email address<input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required /></label
          ><label for="password"
            >Password
            <div class="password-field">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                maxlength="100"
                placeholder="At least 6 characters"
                required
              /><button
                type="button"
                id="toggle-password"
                aria-label="Show password"
              >
                <span data-icon="eye"></span>
              </button></div
          ></label>
          <p
            class="form-message"
            id="form-message"
            role="status"
            aria-live="polite"
          ></p>
          <button class="button button-dark" type="submit">
            Create an account <span data-icon="arrow"></span>
          </button>
        </form>
        <p class="auth-switch">
          Already have a shelf? <a href="/login.html">Log in</a>
        </p>
        <a class="quiet-link" href="/">← Keep exploring</a>
      </div>
    </main>
    <div id="site-footer"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
