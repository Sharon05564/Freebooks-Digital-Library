<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Discover your next great read. Explore free ebooks, revisit the classics, and build a bookshelf of your own."
    />
    <title>Create your bookshelf — FreeBooks</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/common.js" defer></script>
    <script src="/js/app.js" defer></script>
  </head>
  <body data-page="register">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>
    <main id="main" class="auth-main">
      <div class="auth-art" aria-hidden="true">
        <div class="auth-cover cover-one">
          <img src="/assets/covers/pride.svg" alt="" />
        </div>
        <div class="auth-cover cover-two">
          <img src="/assets/covers/alice.svg" alt="" />
        </div>
        <div class="auth-art-caption">
          <span class="eyebrow">YOUR NEXT CHAPTER STARTS HERE</span>
          <h2>A shelf of stories.<br />A world of possibility.</h2>
        </div>
      </div>
      <div class="auth-panel">
        <div class="eyebrow">MAKE YOURSELF AT HOME</div>
        <h1>A bookshelf<br />of your own.</h1>
        <p>Save your discoveries. Find your next favorite.</p>
        <form id="auth-form" method="post" action="/auth/register" data-mode="register" class="stack-form">
          <label for="username"
            >Your name<input
              id="username"
              name="username"
              autocomplete="username"
              minlength="3"
              maxlength="50"
              placeholder="What should we call you?"
              required /></label
          ><label for="email"
            >Email address<input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required /></label
          ><label for="password"
            >Password
            <div class="password-field">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                maxlength="100"
                placeholder="At least 6 characters"
                required
              /><button
                type="button"
                id="toggle-password"
                aria-label="Show password"
              >
                <span data-icon="eye"></span>
              </button></div
          ></label>
          <p
            class="form-message"
            id="form-message"
            role="status"
            aria-live="polite"
          ></p>
          <button class="button button-dark" type="submit">
            Create an account <span data-icon="arrow"></span>
          </button>
        </form>
        <p class="auth-switch">
          Already have a shelf? <a href="/login.html">Log in</a>
        </p>
        <a class="quiet-link" href="/">← Keep exploring</a>
      </div>
    </main>
    <div id="site-footer"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
