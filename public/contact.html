<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Discover your next great read. Explore free ebooks, revisit the classics, and build a bookshelf of your own."
    />
    <title>Say hello — FreeBooks</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/common.js" defer></script>
    <script src="/js/app.js" defer></script>
  </head>
  <body data-page="contact">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>
    <main id="main" class="contact-main">
      <div class="contact-intro">
        <div class="eyebrow">THERE’S ALWAYS ROOM FOR A CONVERSATION</div>
        <h1>A good story<br />starts with hello.</h1>
        <p>
          A question, a book recommendation, or something<br />we could do
          better? We’d love to hear it.
        </p>
        <div class="contact-mark" data-icon="book"></div>
        <a class="text-link" href="/about.html"
          >A little about FreeBooks <span data-icon="arrow"></span
        ></a>
      </div>
      <form class="stack-form panel" id="contact-form">
        <label for="name"
          >Your name<input
            id="name"
            name="name"
            autocomplete="name"
            required
            placeholder="Your name" /></label
        ><label for="email"
          >Email address<input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@example.com" /></label
        ><label for="subject"
          >What’s on your mind?<input
            id="subject"
            name="subject"
            placeholder="A question, an idea, a good book…" /></label
        ><label for="message"
          >Your message<textarea
            id="message"
            name="message"
            rows="5"
            required
            placeholder="Let’s hear it."
          ></textarea>
        </label>
        <p class="form-message" id="form-message" role="status"></p>
        <button class="button button-dark" type="submit">
          Send a little hello <span data-icon="arrow"></span>
        </button>
      </form>
    </main>
    <div id="site-footer"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
